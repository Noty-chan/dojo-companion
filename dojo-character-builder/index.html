<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Паника в Додзе: цифровой компаньон</title>
    <!-- Ставим тему до рендера React, иначе на первой отрисовке мигает светлая тема. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("dojo-theme");
          document.documentElement.setAttribute("data-theme", saved === "light" ? "light" : "dark");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <style>html{background:#0e1218}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
