name: Test, build and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dojo-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dojo-character-builder/package-lock.json
            dojo-table/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          npm ci --prefix dojo-character-builder
          npm ci --prefix dojo-table
      - name: Test
        run: |
          npm test --prefix dojo-character-builder
          npm test --prefix dojo-table
      - name: Build both applications
        run: |
          npm run build --prefix dojo-character-builder
          npm run build --prefix dojo-table
      - name: Verify generated data is committed
        run: git diff --exit-code -- data dojo-character-builder/data dojo-character-builder/public/data dojo-table/public/data
      - name: Assemble Pages artifact
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p pages/table
          cp -R dojo-character-builder/dist/. pages/
          cp -R dojo-table/dist/. pages/table/
          touch pages/.nojekyll
      - name: Publish generated gh-pages branch
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name dojo-ci
          git config user.email dojo-ci@users.noreply.github.com
          git fetch origin gh-pages:gh-pages || true
          git worktree add /tmp/dojo-pages gh-pages
          find /tmp/dojo-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R pages/. /tmp/dojo-pages/
          git -C /tmp/dojo-pages add -A
          git -C /tmp/dojo-pages diff --cached --quiet || git -C /tmp/dojo-pages commit -m "Сборка из ${GITHUB_SHA}"
          git -C /tmp/dojo-pages push origin gh-pages
